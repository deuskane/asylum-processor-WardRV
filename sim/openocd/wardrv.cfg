#-----------------------------------------------------------------------------
# Title      : OpenOCD configuration of the WardRV co-simulation
# Project    : Asylum
#-----------------------------------------------------------------------------
# File       : wardrv.cfg
# Author     : mrosiere
#-----------------------------------------------------------------------------
# Description: OpenOCD 0.12 connected to tb_WardRV_openocd through the
#              remote_bitbang adapter (rbb_server.c of the co-simulation kit
#              asylum:verification:openocd, port 9824).
#              On a board, replace the adapter lines by the ones of the JTAG
#              probe and keep the TAP and target lines.
#-----------------------------------------------------------------------------
# Copyright (c) 2026
#-----------------------------------------------------------------------------
# Revisions  :
# Date        Version  Author   Description
# 2026-11-17  1.0      mrosiere Created
# 2026-11-24  1.1      mrosiere Port 9824 of the co-simulation kit
#-----------------------------------------------------------------------------

adapter driver remote_bitbang
remote_bitbang host 127.0.0.1
remote_bitbang port 9824

# No reset pin : "reset" uses dmcontrol.ndmreset (+ haltreq for "reset halt")
reset_config none

# WardRV_debug : IR of 5 bits, IDCODE_VALUE of tb_WardRV_openocd
jtag newtap riscv cpu -irlen 5 -expected-id 0x1deb0001
target create riscv.cpu riscv -chain-position riscv.cpu

# A simulation is much slower than a chip
riscv set_command_timeout_sec 120
riscv set_reset_timeout_sec 300

# A memory access that fails is an error for GDB (not a read of zeros)
gdb_report_data_abort enable

gdb_port    3333
tcl_port    6666
telnet_port disabled

init
