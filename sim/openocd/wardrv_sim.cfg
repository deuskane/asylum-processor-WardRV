#-----------------------------------------------------------------------------
# Title      : OpenOCD configuration of the WardRV co-simulation
# Project    : Asylum
#-----------------------------------------------------------------------------
# File       : wardrv_sim.cfg
# Author     : mrosiere
#-----------------------------------------------------------------------------
# Description: OpenOCD (0.12, riscv target) connected to the simulation
#              tb_WardRV_openocd through the remote_bitbang adapter
#              (server : sim/openocd/remote_bitbang.c). Started by
#              sim/openocd/launch.sh (target cosim_openocd).
#              Ports : RBB_PORT (9823), GDB_PORT (3333), TCL_PORT (6666).
#-----------------------------------------------------------------------------
# Copyright (c) 2026
#-----------------------------------------------------------------------------
# Revisions  :
# Date        Version  Author   Description
# 2026-10-09  1.0      mrosiere Created
#-----------------------------------------------------------------------------

proc env_or_default {name default} {
    if {[info exists ::env($name)] && $::env($name) ne ""} {
        return $::env($name)
    }
    return $default
}

adapter driver remote_bitbang
remote_bitbang host 127.0.0.1
remote_bitbang port [env_or_default RBB_PORT 9823]

# No SRST : "reset" uses dmcontrol.ndmreset (+ haltreq for "reset halt")
reset_config none

# WardRV_debug : IR 5 bits (Capture-IR = 00001), IDCODE_VALUE of
# tb_WardRV_openocd (C_IDCODE)
jtag newtap riscv cpu -irlen 5 -expected-id 0x1deb0001
target create riscv.cpu riscv -chain-position riscv.cpu

# The simulation is much slower than a chip : long timeouts
riscv set_command_timeout_sec 120
riscv set_reset_timeout_sec 300

gdb_port    [env_or_default GDB_PORT 3333]
tcl_port    [env_or_default TCL_PORT 6666]
telnet_port disabled

init
